<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하이웨이 드라이브 3D</title>
<style>
:root{--hud:rgba(255,255,255,.92);--hudink:#14202a;--accent:#ff8a1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hud:rgba(20,28,36,.88);--hudink:#eef4f8}}
:root[data-theme="dark"]{--hud:rgba(20,28,36,.88);--hudink:#eef4f8}
html,body{height:100%;margin:0;overflow:hidden;background:#9fc9e8;font-family:"Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas.main{display:block}
.box{position:fixed;background:var(--hud);color:var(--hudink);border-radius:14px}
#hud{left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 16px}
#hud b{font-size:2rem;line-height:1}
#btns{left:12px;top:calc(104px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;background:none}
#btns button{font:inherit;font-size:.9rem;padding:8px 12px;border:0;border-radius:10px;background:var(--hud);color:var(--hudink);cursor:pointer;text-align:left}
#sw{display:flex;gap:6px;flex-wrap:wrap;max-width:150px}
#sw button{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--hud)}
#sw button.sel{outline:3px solid var(--accent)}
#mm{right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:130px;height:130px}
#help{right:12px;top:calc(154px + env(safe-area-inset-top,0px));padding:10px 14px;font-size:.8rem;line-height:1.5}
#shiftTag{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:7px 12px;border-radius:9px;background:rgba(20,28,36,.82);color:#fff;font-size:.78rem;display:none;pointer-events:none}
body.shift-lock #shiftTag{display:block}
#shiftDot{position:fixed;left:50%;top:50%;width:5px;height:5px;border:1px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;box-shadow:0 0 3px #000}
body.shift-lock #shiftDot{display:block}
.pad{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
#pl{left:12px}#pr{right:12px}
.pad button{width:68px;height:68px;font-size:1.4rem;border:0;border-radius:50%;background:var(--hud);color:var(--hudink);touch-action:none;user-select:none}
.pad button.on{background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent)}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (hover:none){#help{display:none}}
</style>
</head>
<body>
<div class="box" id="hud"><b id="spd">0</b> km/h<div id="odo" style="font-size:.8rem;opacity:.75">0.00 km</div></div>
<div id="shiftTag">SHIFT LOCK · 시점 고정</div><div id="shiftDot"></div>
<div class="box" id="btns"><button id="cb"></button><button id="nb"></button><button id="wb"></button><button id="sb">🔊 소리 켜짐</button><div id="sw"></div></div>
<canvas class="box" id="mm" width="130" height="130" aria-label="미니맵"></canvas>
<div class="box" id="help">W/↑ 가속 · S/↓ 브레이크<br>A/D 핸들 · Space 급제동<br>Shift 시점 고정 · N 시간 · B 날씨<br>1/2/3 차종 · R 복귀<br>마우스 휠: 카메라 줌 인/아웃</div>
<div class="pad" id="pl"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad" id="pr"><button data-k="brake">■</button><button data-k="gas">▲</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.5,1200);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.15;
ren.domElement.className="main";document.body.appendChild(ren.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x556070,0.85);
const sun=new THREE.DirectionalLight(0xfff2d8,0.8);sun.position.set(80,150,40);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;
const shc=sun.shadow.camera;shc.left=shc.bottom=-70;shc.right=shc.top=70;shc.near=10;shc.far=400;
scene.add(hemi,sun,sun.target);
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const boxG=new THREE.BoxGeometry(1,1,1);

// 고속도로: 양방향 3차로, 중앙분리대, 끝없이 이어지는 폐곡선 순환 도로
// 타원형 경로를 폐곡선으로 만들어 도로의 시작점과 끝점이 자연스럽게 연결됨
const P0=[];for(let k=0;k<24;k++){const t=k/24*Math.PI*2;P0.push(new THREE.Vector3(Math.cos(t)*1750,0,Math.sin(t)*2450));}
const curve=new THREE.CatmullRomCurve3(P0,true,"catmullrom",0.5);
const N=2400,sp=curve.getSpacedPoints(N),M=N+1,Len=curve.getLength(),ds=Len/N;
const LC=[3.25,7.75,12.25],LN=7.75;
const Px=[],Pz=[],Tx=[],Tz=[],Nx=[],Nz=[];
for(let i=0;i<M;i++){
  const p=sp[i],q=sp[Math.min(i+1,N)],o=sp[Math.max(i-1,0)];
  let tx=q.x-o.x,tz=q.z-o.z;const l=Math.hypot(tx,tz);tx/=l;tz/=l;
  Px.push(p.x);Pz.push(p.z);Tx.push(tx);Tz.push(tz);Nx.push(tz);Nz.push(-tx);
}
const Py=[];for(let i=0;i<M;i++)Py.push(10*Math.pow(Math.sin(i/N*Math.PI*7),2));
function tex(base,n){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  x.fillStyle=base;x.fillRect(0,0,256,256);
  for(let i=0;i<n;i++){x.fillStyle=Math.random()<.5?"rgba(0,0,0,.14)":"rgba(255,255,255,.1)";x.fillRect(Math.random()*256,Math.random()*256,2,2)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;
}
const gt=tex("#4f9a4a",6000);gt.repeat.set(200,360);
const asph=tex("#3a3f45",9000);asph.repeat.set(4,1);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6200,7600),new THREE.MeshLambertMaterial({map:gt}));
ground.rotation.x=-Math.PI/2;ground.position.set(0,0,0);ground.receiveShadow=true;scene.add(ground);
function ribbon(off,hw,y,col,dash,mp){
  const pos=[],nor=[],idx=[],uv=[];
  for(let i=0;i<M;i++){
    for(const s of[off-hw,off+hw]){pos.push(Px[i]+Nx[i]*s,y+Py[i],Pz[i]+Nz[i]*s);nor.push(0,1,0);uv.push(s<off?0:1,i*ds/7)}
    if(i<N&&!(dash&&(i>>2)%2)){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
  const rm=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide,map:mp||null}));rm.receiveShadow=true;scene.add(rm);return rm;
}
const roadM=ribbon(0,15,.05,0xffffff,0,asph);ribbon(0,1,.1,0x9a9a94);
ribbon(1,.12,.15,0xf2c744);ribbon(-1,.12,.15,0xf2c744);
for(const s of[-14.6,14.6])ribbon(s,.2,.15,0xffffff);
for(const s of[-10,-5.5,5.5,10])ribbon(s,.12,.15,0xffffff,1);

// 나무와 산
const TN=1400,trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.4,.5,3,6),mat(0x5b3a24),TN),
leaf=new THREE.InstancedMesh(new THREE.ConeGeometry(2.6,7,7),mat(0x2f7d3a),TN),dm=new THREE.Object3D();
for(let c=0;c<TN;){
  const i=Math.floor(Math.random()*M),s=(Math.random()<.5?-1:1)*(20+Math.random()*100);
  const x=Px[i]+Nx[i]*s,z=Pz[i]+Nz[i]*s;let ok=true;
  for(let j=0;j<M;j+=4)if(Math.hypot(x-Px[j],z-Pz[j])<19){ok=false;break}
  if(!ok||(i>N*.54&&i<N*.82&&Math.abs(s)>56))continue;
  const k=.8+Math.random()*.8,hh=Math.max(0,Py[i]*(1-(Math.abs(s)-15.6)/(Py[i]*3+.5)));
  dm.position.set(x,1.5*k+hh,z);dm.scale.set(k,k,k);dm.updateMatrix();trunk.setMatrixAt(c,dm.matrix);
  dm.position.set(x,6.5*k+hh,z);dm.updateMatrix();leaf.setMatrixAt(c,dm.matrix);c++;
}
trunk.frustumCulled=leaf.frustumCulled=false;trunk.castShadow=leaf.castShadow=true;scene.add(trunk,leaf);
for(let k=0;k<40;k++){
  const i=Math.floor(Math.random()*M),s=(Math.random()<.5?-1:1)*(350+Math.random()*300),h=120+Math.random()*140;
  const m=new THREE.Mesh(new THREE.ConeGeometry(100+Math.random()*80,h,5),mat(0x6d7f93));
  m.position.set(Px[i]+Nx[i]*s,h/2,Pz[i]+Nz[i]*s);scene.add(m);
}

// 하늘, 별
const skyU={top:{value:new THREE.Color(0x3d7fc4)},bot:{value:new THREE.Color(0xcfe6f5)}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1000,24,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
vertexShader:"varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
fragmentShader:"uniform vec3 top;uniform vec3 bot;varying float h;void main(){gl_FragColor=vec4(mix(bot,top,pow(max(h,0.),.6)),1.);}"}));
sky.frustumCulled=false;scene.add(sky);
const stars=(()=>{const p=[];for(let i=0;i<700;i++){const t=Math.random()*6.283,u=Math.random()*.9+.05,r=Math.sqrt(1-u*u)*900;p.push(Math.cos(t)*r,u*900,Math.sin(t)*r)}
const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));
const m=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,fog:false}));m.visible=false;m.frustumCulled=false;scene.add(m);return m})();
// 반사용 환경맵
const cubeRT=new THREE.WebGLCubeRenderTarget(128,{generateMipmaps:true,minFilter:THREE.LinearMipmapLinearFilter});
const cubeCam=new THREE.CubeCamera(1,2000,cubeRT);scene.add(cubeCam);scene.environment=cubeRT.texture;
function updEnv(){const pv=player.visible;player.visible=false;stars.visible=false;sky.position.set(0,0,0);cubeCam.position.set(0,2,0);cubeCam.update(ren,scene);player.visible=pv}
// 가드레일과 중앙분리대
function wall(off,y0,y1,col){
  const pos=[],nor=[],idx=[];
  for(let i=0;i<M;i++){const x=Px[i]+Nx[i]*off,z=Pz[i]+Nz[i]*off;pos.push(x,y0+Py[i],z,x,y1+Py[i],z);nor.push(Nx[i],0,Nz[i],Nx[i],0,Nz[i]);if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));g.setIndex(idx);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:col,metalness:.7,roughness:.4,side:THREE.DoubleSide}));m.receiveShadow=true;m.castShadow=true;scene.add(m);
}
wall(15.6,.35,.95,0xb9c0c6);wall(-15.6,.35,.95,0xb9c0c6);wall(0,.1,1,0xa8a8a2);
// 가로등
const lampM=new THREE.MeshBasicMaterial({color:0x9a9a94}),LCN=Math.floor(N/14)+1,gm0=mat(0x77797c);
const poles=new THREE.InstancedMesh(new THREE.CylinderGeometry(.12,.18,9,6),gm0,LCN),
heads=new THREE.InstancedMesh(boxG,lampM,LCN*2),arms=new THREE.InstancedMesh(boxG,gm0,LCN*2);
let hc=0;
for(let c=0;c<LCN;c++){
  const i=Math.min(N,c*14);dm.rotation.set(0,Math.atan2(Tx[i],Tz[i]),0);
  dm.scale.set(1,1,1);dm.position.set(Px[i],4.5+Py[i],Pz[i]);dm.updateMatrix();poles.setMatrixAt(c,dm.matrix);
  for(const sd of[-1,1]){
    dm.scale.set(.5,.2,1.8);dm.position.set(Px[i]+Nx[i]*sd*3.4,9+Py[i],Pz[i]+Nz[i]*sd*3.4);dm.updateMatrix();heads.setMatrixAt(hc,dm.matrix);
    dm.scale.set(3.4,.12,.12);dm.position.set(Px[i]+Nx[i]*sd*1.7,9+Py[i],Pz[i]+Nz[i]*sd*1.7);dm.updateMatrix();arms.setMatrixAt(hc,dm.matrix);hc++;
  }
}
poles.frustumCulled=heads.frustumCulled=arms.frustumCulled=false;scene.add(poles,heads,arms);

// 경사면(둑)
function slope(sd){
  const pos=[],idx=[];
  for(let i=0;i<M;i++){const w=15.6+Py[i]*3+.5;
    pos.push(Px[i]+Nx[i]*sd*15.6,Py[i]-.05,Pz[i]+Nz[i]*sd*15.6,Px[i]+Nx[i]*sd*w,0,Pz[i]+Nz[i]*sd*w);
    if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x4a9246,side:THREE.DoubleSide}));m.receiveShadow=true;scene.add(m);
}
slope(1);slope(-1);
// 터널
const TI0=Math.floor(N*.3),TI1=TI0+70;
(function(){
  const pos=[],idx=[],n=TI1-TI0+1;
  const add=(o1,y1,o2,y2)=>{const b=pos.length/3;for(let i=TI0;i<=TI1;i++)pos.push(Px[i]+Nx[i]*o1,Py[i]+y1,Pz[i]+Nz[i]*o1,Px[i]+Nx[i]*o2,Py[i]+y2,Pz[i]+Nz[i]*o2);
    for(let k=0;k<n-1;k++){const a=b+k*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}};
  add(-17,0,-17,10);add(17,0,17,10);add(-17,10,17,10);
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x8d8d88,roughness:.9,side:THREE.DoubleSide}));m.castShadow=true;m.receiveShadow=true;scene.add(m);
  const lm=new THREE.MeshBasicMaterial({color:0xfff0c0});
  for(let i=TI0+2;i<TI1;i+=6)for(const sd of[-4,4]){const q=new THREE.Mesh(boxG,lm);q.scale.set(1.2,.15,.6);q.position.set(Px[i]+Nx[i]*sd,Py[i]+9.8,Pz[i]+Nz[i]*sd);q.rotation.y=Math.atan2(Tx[i],Tz[i]);scene.add(q)}
})();
// 도심 구간 건물 (2겹, 촘촘하게, 밤에 창문 점등)
const mkWin=(bg,fn)=>{const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");x.fillStyle=bg;x.fillRect(0,0,128,128);
  for(let y=6;y<128;y+=16)for(let k=6;k<128;k+=16){x.fillStyle=fn();x.fillRect(k,y,9,10)}return new THREE.CanvasTexture(c)};
const bmat=new THREE.MeshLambertMaterial({map:mkWin("#9aa5b0",()=>"#3b5068"),emissive:0xffffff,emissiveMap:mkWin("#000",()=>Math.random()<.45?"#ffd88a":"#000"),emissiveIntensity:0});
const BN=720,blds=new THREE.InstancedMesh(boxG,bmat,BN);
for(let c=0;c<BN;c++){
  const sd=c&1?1:-1,far=(c>>1)&1,st=c>>2,i=Math.min(N,Math.floor(N*.55)+st*2),u=st/180;
  const w=14+Math.random()*16,h=12+(1-Math.abs(u-.5)*2)*40*Math.random()+Math.random()*10+far*10,off=far?96+Math.random()*40:60+Math.random()*18;
  dm.rotation.set(0,Math.atan2(Tx[i],Tz[i]),0);dm.scale.set(w,h,w*(.8+Math.random()*.6));
  dm.position.set(Px[i]+Nx[i]*sd*off,h/2,Pz[i]+Nz[i]*sd*off);dm.updateMatrix();blds.setMatrixAt(c,dm.matrix);
  blds.setColorAt(c,new THREE.Color().setHSL(.58,.08,.62+Math.random()*.35));
}
blds.frustumCulled=false;scene.add(blds);
// 도로 표지판 제거
// 차종
const TP=[{n:"스포츠",c:0xd62839,max:64,acc:30,turn:2.1,h:.7,cab:.6,len:4.4},
{n:"세단",c:0x2a6fdb,max:54,acc:24,turn:1.9,h:.8,cab:.7,len:4.6},
{n:"SUV",c:0x3a9d5d,max:46,acc:20,turn:1.7,h:1.1,cab:.9,len:4.8}];
function ext(pts,w,m){
  const s=new THREE.Shape(pts.map(q=>new THREE.Vector2(q[0],q[1])));
  const gm=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:true,bevelThickness:.06,bevelSize:.06,bevelSegments:2});
  gm.rotateY(-Math.PI/2);gm.translate(w/2,0,0);
  return new THREE.Mesh(gm,m);
}
function mk(t,col){
  const g=new THREE.Group(),T=TP[t],L=T.len,hb=.35+T.h,hr=hb+T.cab;
  const F=[[.15,-.02,-.2,-.3],[.18,0,-.22,-.36],[.2,.1,-.34,-.4]][t].map(f=>f*L);
  const bm=new THREE.MeshStandardMaterial({color:col||T.c,metalness:.55,roughness:.28,envMapIntensity:1.1});
  const gm=new THREE.MeshStandardMaterial({color:0x0c141b,metalness:.9,roughness:.08,envMapIntensity:1.3});
  const dk=mat(0x15181b),lt=c=>new THREE.MeshBasicMaterial({color:c}),tl=new THREE.MeshBasicMaterial({color:0x7a1515});g.userData.tail=tl;
  const bx=(w,h,d,m,x,y,z)=>{const q=new THREE.Mesh(boxG,m);q.scale.set(w,h,d);q.position.set(x,y,z);g.add(q)};
  g.add(ext([[-L/2,.3],[L/2,.3],[L/2,hb-.2],[L/2-.15,hb-.1],[F[0],hb],[F[3],hb],[-L/2+.15,hb-.05],[-L/2,hb-.2]],2,bm));
  g.add(ext([[F[0],hb],[F[1],hr],[F[2],hr],[F[3],hb]],1.8,gm));
  bx(1.78,.07,F[1]-F[2],bm,0,hr+.04,(F[1]+F[2])/2);
  g.userData.wh=[];
  for(const x of[-1,1])for(const z of[-L*.3,L*.3]){
    const pivot=new THREE.Group(),roll=new THREE.Group(),w=new THREE.Group(),spk=mat(0x4a4f55);
    w.add(new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,18),dk),new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.32,10),mat(0xb8bec4)));
    for(let k=0;k<5;k++){const q=new THREE.Mesh(boxG,spk);q.scale.set(.5,.34,.05);q.rotation.y=k*Math.PI/5;w.add(q)}
    w.rotation.z=Math.PI/2;roll.add(w);pivot.add(roll);pivot.position.set(x*.95,.42,z);g.add(pivot);
    g.userData.wh.push({pivot,roll,front:z>0});
  }
  for(const s of[-1,1]){
    bx(.5,.16,.08,lt(0xfff2c0),s*.72,hb-.28,L/2+.09);
    bx(.5,.14,.08,tl,s*.72,hb-.22,-L/2-.09);
    bx(.1,.1,.2,bm,s*1.13,hb+.14,F[0]-.05);bx(.16,.05,.06,dk,s*1.04,hb+.1,F[0]);
  }
  bx(1.1,.18,.06,dk,0,hb-.3,L/2+.08);
  bx(2.04,.22,.14,dk,0,.5,L/2);bx(2.04,.22,.14,dk,0,.5,-L/2);
  bx(.5,.14,.02,lt(0xf4f4f0),0,.55,-L/2-.09);
  bx(1.9,.2,L-.2,dk,0,.32,0);
  if(t===0){bx(1.8,.06,.35,dk,0,hb+.2,-L/2+.2);for(const s of[-.6,.6])bx(.06,.2,.1,dk,s,hb+.1,-L/2+.2)}
  g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  return g;
}
function animCar(g,d,st,br){
  for(const w of g.userData.wh){w.roll.rotation.x+=d/.42;if(w.front)w.pivot.rotation.y=st}
  if(br!==undefined)g.userData.tail.color.setHex(br?0xff1a1a:0x7a1515);
}
const player=new THREE.Group();player.rotation.order="YXZ";scene.add(player);
const tl2=new THREE.PointLight(0xffe0a0,0,45);tl2.position.set(0,6,0);player.add(tl2);
const spot=new THREE.SpotLight(0xfff4d0,0,140,.55,.5);
spot.position.set(0,1.2,2);spot.target.position.set(0,0,30);player.add(spot,spot.target);
let body,ct=0,curCol=null;
function setCar(t){ct=t;if(body)player.remove(body);body=mk(t,curCol);player.add(body);$("cb").textContent="🚗 차종: "+TP[t].n}
setCar(0);

// 차 색상 선택
[0xd62839,0x2a6fdb,0x3a9d5d,0xf4c20d,0xff8a1f,0xe5e7eb,0x222831].forEach(c=>{
  const b=document.createElement("button");b.style.background="#"+c.toString(16).padStart(6,"0");b.setAttribute("aria-label","차 색상");
  b.onclick=()=>{curCol=c;setCar(ct);[...$("sw").children].forEach(x=>x.classList.toggle("sel",x===b))};
  $("sw").appendChild(b);
});

// 교통: 같은 방향 16대, 반대 방향 10대
const tr=[],cols=[0xe5e7eb,0xf4c20d,0x8e44ad,0x16a085,0xc0392b,0x34495e];
for(let k=0;k<26;k++){
  const opp=k>=16,m=mk(1,cols[k%6]);scene.add(m);
  const vv=opp?20+Math.random()*10:14+Math.random()*16,ln0=(opp?1:-1)*LC[k%3];
  tr.push({m,s:300+Math.random()*(Len-600),dir:opp?-1:1,v:vv,bv:vv,ln:ln0,tl:ln0,cd:Math.random()*3,x:0,z:0});
}

// 충돌 불꽃
const SPN=90,spP=new Float32Array(SPN*3).fill(-999),spV=new Float32Array(SPN*3),spL=new Float32Array(SPN);let spI=0;
const spG=new THREE.BufferGeometry();spG.setAttribute("position",new THREE.BufferAttribute(spP,3));
const sparks=new THREE.Points(spG,new THREE.PointsMaterial({color:0xffc060,size:5,sizeAttenuation:false,fog:false}));sparks.frustumCulled=false;scene.add(sparks);
function emit(x,y,z,n){for(let k=0;k<n;k++){const i=spI++%SPN;spP.set([x,y,z],i*3);spV.set([(Math.random()-.5)*14,Math.random()*8,(Math.random()-.5)*14],i*3);spL[i]=.5+Math.random()*.4}}
function stepSparks(dt){for(let i=0;i<SPN;i++){if(spL[i]<=0)continue;spL[i]-=dt;if(spL[i]<=0){spP[i*3+1]=-999;continue}spV[i*3+1]-=18*dt;for(let c=0;c<3;c++)spP[i*3+c]+=spV[i*3+c]*dt}spG.attributes.position.needsUpdate=true}
// 비
const RN=2600,rP=new Float32Array(RN*6),rO=[];for(let i=0;i<RN;i++)rO.push([(Math.random()-.5)*80,Math.random()*38-8,(Math.random()-.5)*80]);
const rG=new THREE.BufferGeometry();rG.setAttribute("position",new THREE.BufferAttribute(rP,3));
const rain=new THREE.LineSegments(rG,new THREE.LineBasicMaterial({color:0xb8c4d0,transparent:true,opacity:.55,fog:false}));rain.frustumCulled=false;rain.visible=false;scene.add(rain);
let flashT=0;
function thunder(){if(!ac||mute)return;const b=ac.createBuffer(1,ac.sampleRate*1.6,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const sn=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type="lowpass";f.frequency.value=180;g.gain.value=.5;
  sn.buffer=b;sn.connect(f);f.connect(g);g.connect(ac.destination);sn.start(ac.currentTime+.4)}
function stepRain(dt){
  if(!rain.visible)return;const sx=-Math.sin(a)*v*.035,sz=-Math.cos(a)*v*.035;
  for(let i=0;i<RN;i++){const o=rO[i];o[1]-=55*dt;if(o[1]<-8){o[1]=30;o[0]=(Math.random()-.5)*80;o[2]=(Math.random()-.5)*80}
    const x=cam.position.x+o[0],y=cam.position.y+o[1],z=cam.position.z+o[2];rP.set([x,y,z,x+sx,y+1.8,z+sz],i*6)}
  rG.attributes.position.needsUpdate=true}
// 도로 높이와 교통 AI
function roadY(x,z,i){const t=((x-Px[i])*Tx[i]+(z-Pz[i])*Tz[i])/ds,j=Math.max(0,Math.min(N,i+(t>0?1:-1)));return Py[i]+(Py[j]-Py[i])*Math.min(1,Math.abs(t))}
let gLat=0,pitch=0;
function ahead(o,ln){let g=1e9,av=o.bv;
  for(const q of tr){if(q===o||q.dir!==o.dir||Math.abs(q.ln-ln)>2.4)continue;const d=(q.s-o.s)*o.dir;if(d>0&&d<g){g=d;av=q.v}}
  if(o.dir>0&&Math.abs(gLat-ln)<2.4){const d=ni*ds-o.s;if(d>0&&d<g){g=d;av=Math.max(0,v)}}
  return[g,av]}
function free(o,ln){
  if(tr.some(q=>q!==o&&q.dir===o.dir&&Math.abs(q.ln-ln)<2.6&&Math.abs(q.s-o.s)<18))return false;
  if(o.dir>0&&Math.abs(gLat-ln)<2.6&&Math.abs(ni*ds-o.s)<18)return false;
  return ahead(o,ln)[0]>40}
// 시간대와 날씨
let tod=0,wx=0,baseHemi=.85,baseSun=.8,SO=[80,150,40];
const TM=[{top:0x3d7fc4,bot:0xcfe6f5,hemi:.85,sun:.8,sc:0xfff2d8,hl:0,lamp:0,sp:[80,150,40]},
{top:0x2b3f73,bot:0xf2a46b,hemi:.5,sun:.55,sc:0xff9d5c,hl:.8,lamp:1,sp:[160,45,40]},
{top:0x050a18,bot:0x0b1426,hemi:.22,sun:.05,sc:0x8aa0ff,hl:2.2,lamp:1,sp:[80,150,40]}];
function applyEnv(){
  const T=TM[tod],c1=new THREE.Color(T.top),c2=new THREE.Color(T.bot),gr=new THREE.Color(tod===2?0x10141c:0x9aa3ab);
  let fn=80,ff=800,hm=T.hemi,sn=T.sun;
  if(tod===2){fn=10;ff=260}
  if(wx===1){c1.lerp(gr,.6);c2.lerp(gr,.6);fn=15;ff=320;hm*=.8;sn*=.35}
  if(wx===2){c1.lerp(gr,.5);c2.lerp(new THREE.Color(tod===2?0x1a2030:0xc9d0d6),.85);fn=2;ff=120;hm*=.95;sn*=.25}
  skyU.top.value.copy(c1);skyU.bot.value.copy(c2);scene.fog=new THREE.Fog(c2.getHex(),fn,ff);
  baseHemi=hm;baseSun=sn;SO=T.sp;sun.color.setHex(T.sc);spot.intensity=T.hl;
  stars.visible=tod===2&&wx===0;lampM.color.setHex(T.lamp?0xffe9a8:0x9a9a94);rain.visible=wx===1;roadM.material.color.setHex(wx===1?0x6f7882:0xffffff);blds.material.emissiveIntensity=tod===2?1:tod===1?.35:0;
  document.body.style.background="#"+c2.getHexString();
  $("nb").textContent="🕒 시간: "+["낮","노을","밤"][tod];$("wb").textContent="⛅ 날씨: "+["맑음","비","안개"][wx];updEnv();
}
function cycleTime(){tod=(tod+1)%3;applyEnv()}
function cycleWx(){wx=(wx+1)%3;applyEnv()}

// 낮/밤
let night=false;
function setNight(b){
  night=b;const c=b?0x0b1426:0xcfe6f5;skyU.top.value.setHex(b?0x050a18:0x3d7fc4);skyU.bot.value.setHex(c);stars.visible=b;lampM.color.setHex(b?0xffe9a8:0x9a9a94);
  scene.background=new THREE.Color(c);scene.fog=new THREE.Fog(c,b?10:80,b?260:800);
  hemi.intensity=b?.22:.85;sun.intensity=b?.05:.8;spot.intensity=b?2.2:0;
  document.body.style.background="#"+c.toString(16).padStart(6,"0");
  $("nb").textContent=b?"☀️ 낮 모드":"🌙 밤 모드";updEnv();
}
applyEnv();

// 상태와 입력
const K={};let v=0,a=0,steer=0,px=0,pz=0,ni=0;
function place(i){
  px=Px[i]-Nx[i]*LN;pz=Pz[i]-Nz[i]*LN;a=Math.atan2(Tx[i],Tz[i]);steer=0;
  cam.position.set(px-Math.sin(a)*11,5,pz-Math.cos(a)*11);
}
place(0);
const map={ArrowUp:"gas",w:"gas",W:"gas",ArrowDown:"brake",s:"brake",S:"brake",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"," ":"hb"};
// 카메라 회전 및 추적 상태
let oy=0,op=0,zm=1,zmTarget=1,idle=0;
// Roblox 스타일 Shift Lock: Shift로 마우스 포인터를 잠그고
// 마우스 이동만으로 카메라를 회전시킴
let shiftLock=false;
function setShiftLock(on){
  if(on){
    if(document.pointerLockElement!==ren.domElement){
      try{
        const request=ren.domElement.requestPointerLock();
        if(request && typeof request.catch==="function") request.catch(()=>{
          shiftLock=false;
          document.body.classList.remove("shift-lock");
        });
      }catch(err){
        shiftLock=false;
        document.body.classList.remove("shift-lock");
        return;
      }
    }
  }else if(document.pointerLockElement===ren.domElement){
    document.exitPointerLock();
  }
  shiftLock=on;
  document.body.classList.toggle("shift-lock",shiftLock);
}
document.addEventListener("pointerlockchange",()=>{
  shiftLock=document.pointerLockElement===ren.domElement;
  document.body.classList.toggle("shift-lock",shiftLock);
});
document.addEventListener("pointerlockerror",()=>{
  shiftLock=false;
  document.body.classList.remove("shift-lock");
});
addEventListener("keydown",e=>{
  if(e.key==="Shift"&&!e.repeat){setShiftLock(!shiftLock);e.preventDefault();return}
  if(map[e.key]){K[map[e.key]]=1;e.preventDefault()}
  else if(e.key==="r"||e.key==="R"){place(ni);v=0}
  else if(e.key==="n"||e.key==="N")cycleTime();
  else if(e.key==="b"||e.key==="B")cycleWx();
  else if("123".includes(e.key)&&e.key)setCar(+e.key-1);
});
addEventListener("keyup",e=>{if(map[e.key])K[map[e.key]]=0});
$("wb").onclick=cycleWx;$("cb").onclick=()=>setCar((ct+1)%3);$("nb").onclick=()=>cycleTime();
document.querySelectorAll("button[data-k]").forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener("pointerdown",e=>{e.preventDefault();K[k]=1;b.classList.add("on")});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>b.addEventListener(t,()=>{K[k]=0;b.classList.remove("on")}));
});
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

// 엔진 소리
let ac,osc,gn,flt,mute=false,od=0;
function startAudio(){
  if(ac)return;
  try{ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type="sawtooth";
  flt=ac.createBiquadFilter();flt.type="lowpass";flt.frequency.value=500;gn=ac.createGain();gn.gain.value=0;
  osc.connect(flt);flt.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){ac=null}
}
addEventListener("pointerdown",startAudio);addEventListener("keydown",startAudio);
$("sb").onclick=()=>{mute=!mute;$("sb").textContent=mute?"🔇 소리 꺼짐":"🔊 소리 켜짐"};
function engine(){
  if(!ac)return;const r=Math.min(1,Math.abs(v)/64);
  osc.frequency.value=45+r*170+(K.gas?15:0);flt.frequency.value=300+r*900;gn.gain.value=mute?0:.05+r*.05;
}

// Shift Lock 상태에서만 마우스 이동으로 카메라 회전
// Pointer Lock이 활성화되면 포인터가 화면에서 사라지고 마우스가 화면 밖으로 나가지 않음
const cv=ren.domElement;
cv.addEventListener("contextmenu",e=>e.preventDefault());
// 마우스 휠로 카메라 줌 인/아웃 (Shift Lock 중에도 사용 가능)
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const zoomFactor=Math.exp(e.deltaY*0.001);
  zmTarget=Math.max(0.55,Math.min(1.8,zmTarget*zoomFactor));
},{passive:false});
document.addEventListener("mousemove",e=>{
  if(!shiftLock || document.pointerLockElement!==cv)return;
  const dx=e.movementX||0;
  const dy=e.movementY||0;
  oy-=dx*.0028;
  op=Math.max(-.2,Math.min(1.2,op+dy*.0028));
  idle=0;
});

// 미니맵: 내 차 주변 약 400m
const mg=$("mm").getContext("2d"),S=.16;
function drawMap(){
  mg.clearRect(0,0,130,130);mg.lineWidth=7;mg.strokeStyle="#888";mg.lineJoin="round";mg.beginPath();
  const lo=Math.max(0,ni-110),hi=Math.min(N,ni+110);
  for(let i=lo;i<=hi;i++){const x=65+(Px[i]-px)*S,y=65+(Pz[i]-pz)*S;i===lo?mg.moveTo(x,y):mg.lineTo(x,y)}
  mg.stroke();
  mg.fillStyle="#f2a900";
  for(const o of tr){const x=65+(o.x-px)*S,y=65+(o.z-pz)*S;if(x>0&&x<130&&y>0&&y<130){mg.beginPath();mg.arc(x,y,2.5,0,6.3);mg.fill()}}
  mg.strokeStyle="#ff3b30";mg.lineWidth=2;mg.beginPath();mg.moveTo(65,65);mg.lineTo(65+Math.sin(a)*10,65+Math.cos(a)*10);mg.stroke();
  mg.fillStyle="#ff3b30";mg.beginPath();mg.arc(65,65,4,0,6.3);mg.fill();
}

// 카메라 위치와 시선 목표를 함께 보간해 줌 상태에서의 미세한 흔들림을 줄임
const camLook=new THREE.Vector3();
let camLookReady=false;
let last=performance.now();
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;const T=TP[ct];
  let md=1e9;for(let i=0;i<M;i+=2){const d=(px-Px[i])**2+(pz-Pz[i])**2;if(d<md){md=d;ni=i}}
  if(ni>M-12){const vv=v;place(3);v=vv;ni=3}
  const off=Math.sqrt(md)>16.5;
  if(K.gas)v+=(v<0?T.acc*2:T.acc)*dt;
  if(K.brake)v-=(v>0?48:14)*dt;
  if(K.hb)v*=Math.max(0,1-3*dt);
  v*=1-(off?1.8:.3)*dt;
  const mx=off?T.max*.55:T.max;v=Math.max(-14,Math.min(mx,v));
  if(!K.gas&&!K.brake&&Math.abs(v)<.4)v=0;
  steer+=(((K.left?1:0)-(K.right?1:0))-steer)*Math.min(1,5*dt);
  a+=steer*T.turn*.7*dt*Math.max(-1,Math.min(1,v/10));
  px+=Math.sin(a)*v*dt;pz+=Math.cos(a)*v*dt;od+=Math.abs(v)*dt;
  const lat=(px-Px[ni])*Nx[ni]+(pz-Pz[ni])*Nz[ni],al=Math.abs(lat),sg=lat<0?-1:1,tg=al<1.7?1.7:al>14.3?14.3:al;
  let hitW=0;if(tg!==al){const dd=(tg-al)*sg;px+=Nx[ni]*dd;pz+=Nz[ni]*dd;if(Math.abs(v)>8)hitW=1;v*=.8}
  const yR=roadY(px,pz,ni);if(hitW)emit(px,yR+.8,pz,12);
  for(const o of tr){
    gLat=lat;
    const g1=ahead(o,o.tl);
    if(g1[0]<32){o.v=Math.max(g1[1]*.9,o.v-14*dt);
      if(o.cd<=0)for(const l of LC){const l2=Math.sign(o.ln)*l;if(Math.abs(l2-o.tl)>1&&Math.abs(l2-o.tl)<5&&free(o,l2)){o.tl=l2;o.cd=4;break}}}
    else o.v=Math.min(o.bv,o.v+5*dt);
    o.cd-=dt;o.ln+=(o.tl-o.ln)*Math.min(1,1.2*dt);
    o.s+=o.dir*o.v*dt;if(o.s>Len-20)o.s=20;if(o.s<20)o.s=Len-20;
    const f=Math.min(N-1,o.s/ds),i=Math.floor(f),j=i+1,u=f-i;
    o.x=Px[i]+(Px[j]-Px[i])*u+Nx[i]*o.ln;o.z=Pz[i]+(Pz[j]-Pz[i])*u+Nz[i]*o.ln;
    o.m.position.set(o.x,Py[i]+(Py[j]-Py[i])*u,o.z);o.m.rotation.y=Math.atan2(Tx[i],Tz[i])+(o.dir<0?Math.PI:0);animCar(o.m,o.v*dt,0,o.v<o.bv*.9);
    const dx=px-o.x,dz=pz-o.z,d=Math.hypot(dx,dz);
    if(d<3.6&&d>.01){px+=dx/d*(3.6-d);pz+=dz/d*(3.6-d);v*=.55;emit(px,yR+.8,pz,14)}
  }
  animCar(body,v*dt,steer*.5,(K.brake||K.hb)&&v>.5);
  const tun=ni>=TI0&&ni<=TI1;if(wx===1&&flashT<=0&&Math.random()<dt*.04){flashT=.18;thunder()}flashT=Math.max(0,flashT-dt);hemi.intensity=(tun?.3:baseHemi)+flashT*8;sun.intensity=tun?.05:baseSun;tl2.intensity=tun?1.3:0;
  player.position.set(px,yR,pz);sun.target.position.set(px,yR,pz);sun.position.set(px+SO[0],yR+SO[1],pz+SO[2]);
  const j2=Math.min(N,ni+1),sl=(Py[j2]-Py[ni])/ds*((Math.sin(a)*Tx[ni]+Math.cos(a)*Tz[ni])>0?1:-1);
  pitch+=(-Math.atan(sl)-pitch)*Math.min(1,6*dt);player.rotation.x=pitch;player.rotation.y=a;player.rotation.z=-steer*Math.min(1,Math.abs(v)/40)*.06;
  if(!shiftLock){idle+=dt;if(idle>1.5){const e=1-Math.exp(-3*dt);oy-=oy*e;op-=op*e}}

  // 줌과 카메라 추적을 프레임 시간 기반으로 부드럽게 보간
  zm+=(zmTarget-zm)*(1-Math.exp(-10*dt));
  const ang=a+oy,dist=(11+v*.08)*zm,hh=Math.max(1.5,5+v*.03+op*dist*.8);
  const camAlpha=1-Math.exp(-(shiftLock?16:9)*dt);
  // Shift Lock: 카메라를 차량 뒤쪽 오른쪽 어깨 위치로 옮겨 차량을 따라가게 함
  const shoulder=shiftLock?2.6:0;
  const rightX=Math.cos(ang),rightZ=-Math.sin(ang);
  const desiredCam=new THREE.Vector3(
    px-Math.sin(ang)*dist+rightX*shoulder,
    hh+yR,
    pz-Math.cos(ang)*dist+rightZ*shoulder
  );
  cam.position.lerp(desiredCam,camAlpha);
  const k=Math.max(0,1-Math.abs(oy));
  const lookSide=shiftLock?0.8:0;
  const desiredLook=new THREE.Vector3(
    px+Math.sin(a)*8*k+rightX*lookSide,
    1.5+yR,
    pz+Math.cos(a)*8*k+rightZ*lookSide
  );
  if(!camLookReady){camLook.copy(desiredLook);camLookReady=true;}
  else camLook.lerp(desiredLook,camAlpha);
  cam.lookAt(camLook);
  cam.fov=65+Math.min(1,Math.abs(v)/60)*14;cam.updateProjectionMatrix();sky.position.copy(cam.position);stars.position.copy(cam.position);engine();stepSparks(dt);stepRain(dt);
  $("odo").textContent=(od/1000).toFixed(2)+" km";
  $("spd").textContent=Math.round(Math.abs(v)*3.6);
  drawMap();ren.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
